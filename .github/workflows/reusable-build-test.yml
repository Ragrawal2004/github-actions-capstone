---
name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      run_tests:
        description: "Whether to run the tests"
        required: false
        type: boolean
        default: true
    outputs:
      test_result:
        description: "success, failure or skipped"
        value: ${{ jobs.build-test.outputs.test_result }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.result.outputs.test_result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build check
        run: |
          python -m compileall -q app

      - name: Run tests
        id: tests
        if: inputs.run_tests
        run: |
          pytest -v

      - name: Record the test result
        id: result
        if: always()
        run: |
          echo "test_result=${{ steps.tests.outcome }}" >> "$GITHUB_OUTPUT"
