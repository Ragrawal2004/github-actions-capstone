---
name: Main Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: "3.12"
      run_tests: true

  meta:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Compute the short commit SHA
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  docker:
    needs: [build-test, meta]
    uses: ./.github/workflows/reusable-docker.yml
    # The called workflow can't have more permission than this job grants
    permissions:
      contents: read
      security-events: write
    with:
      image_name: rounak810/capstone
      tag: sha-${{ needs.meta.outputs.short_sha }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hub.docker.com/r/rounak810/capstone
    steps:
      - name: Deploy (simulated)
        env:
          IMAGE_URL: ${{ needs.docker.outputs.image_url }}
        run: |
          echo "Deploying $IMAGE_URL to production"
          {
            echo "## Deployment"
            echo ""
            echo "Deployed image: \`$IMAGE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
