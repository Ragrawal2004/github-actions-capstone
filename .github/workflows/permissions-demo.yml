---
name: Permissions Demo

on: workflow_dispatch

permissions:
  contents: read

jobs:
  try-write:
    runs-on: ubuntu-latest
    steps:
      - name: Try to create an issue (needs issues write)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue create --repo "$REPO" --title "Permissions demo" --body "Created by the demo workflow"
