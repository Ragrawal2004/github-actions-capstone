---
name: PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: "3.12"
      run_tests: true

  summary:
    needs: build-test
    if: always()
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      SOURCE_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Write the PR summary
        run: |
          {
            echo "## PR pipeline summary"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| Title | $PR_TITLE |"
            echo "| Source branch | $SOURCE_BRANCH |"
            echo "| Build and test job | ${{ needs.build-test.result }} |"
            echo "| Tests | ${{ needs.build-test.outputs.test_result }} |"
            echo "| Docker image pushed | no, never on pull requests |"
          } >> "$GITHUB_STEP_SUMMARY"
